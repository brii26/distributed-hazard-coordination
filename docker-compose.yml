# See doc/TRD_M1.md for the full specification each service implements.

# Tracing (#116): every Go service exports spans here when TRACING_ENABLED=true.
# Jaeger is not a dependency; with it down, services keep serving.
x-tracing: &tracing
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}

services:
  # Jaeger v2: stores traces in memory and turns spans into RED metrics itself (spanmetrics),
  # which Prometheus scrapes and the Monitor tab reads back (#116). Configs are inline so no
  # host file's permissions can stop the container reading them.
  jaeger:
    restart: unless-stopped
    image: jaegertracing/jaeger:2.22.0
    command: ["--config", "/etc/jaeger/config.yml"]
    configs:
      - source: jaeger_config
        target: /etc/jaeger/config.yml
      - source: jaeger_ui_config
        target: /etc/jaeger/jaeger-ui.json
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  # Holds only the numbers Jaeger derives from spans. Internal to the compose network, no
  # published port, no volume: losing it on a restart only empties the charts.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.6.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

  bmkg-mock:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/bmkg-mock
    ports:
      - "${BMKG_PORT:-8081}:8081"
    environment:
      <<: *tracing
      PORT: 8081
      BMKG_API_KEY: ${BMKG_API_KEY}
      SEED_COUNT: ${BMKG_SEED_COUNT:-20}
      EVENT_INTERVAL_S: ${BMKG_EVENT_INTERVAL_S:-10}
      BMKG_DELAY_MIN_MS: ${BMKG_DELAY_MIN_MS:-50}
      BMKG_DELAY_MAX_MS: ${BMKG_DELAY_MAX_MS:-150}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  pvmbg-mock:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/pvmbg-mock
    ports:
      - "${PVMBG_PORT:-8082}:8082"
    environment:
      <<: *tracing
      PORT: 8082
      OAUTH_CLIENT_ID: ${PVMBG_OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${PVMBG_OAUTH_CLIENT_SECRET}
      PVMBG_ONE_TIME_CODE: ${PVMBG_ONE_TIME_CODE}
      ADMIN_KEY: ${PVMBG_ADMIN_KEY}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      SEED_COUNT: ${PVMBG_SEED_COUNT:-20}
      EVENT_INTERVAL_S: ${PVMBG_EVENT_INTERVAL_S:-10}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  canonical-store:
    restart: unless-stopped
    image: postgres:16-alpine
    networks:
      - canonical-net
    environment:
      POSTGRES_USER: ${CANONICAL_DB_USER:-aggregator}
      POSTGRES_PASSWORD: ${CANONICAL_DB_PASSWORD}
      POSTGRES_DB: ${CANONICAL_DB_NAME:-canonical_store}
    volumes:
      - canonical_store_data:/var/lib/postgresql/data
      - ./services/aggregator/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CANONICAL_DB_USER:-aggregator} -d ${CANONICAL_DB_NAME:-canonical_store}"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-db:
    restart: unless-stopped
    image: postgres:16-alpine
    networks:
      - userdb-net
    environment:
      POSTGRES_USER: ${USER_DB_USER:-auth}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      # Read only by the init seed script.
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      SECRET_SALT: ${SECRET_SALT}
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./services/auth-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-auth} -d ${USER_DB_NAME:-user_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    entrypoint: ["/bin/sh", "/etc/rabbitmq/render-definitions.sh"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json.tpl:/etc/rabbitmq/definitions.json.tpl:ro
      - ./infra/rabbitmq/render-definitions.sh:/etc/rabbitmq/render-definitions.sh:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  aggregator:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/aggregator
    networks:
      - default
      - canonical-net
    depends_on:
      canonical-store:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_healthy
      pvmbg-mock:
        condition: service_healthy
    environment:
      <<: *tracing
      GRPC_PORT: 9091
      HEALTH_PORT: 8091
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-3000}
      POLL_TIMEOUT_MS: ${POLL_TIMEOUT_MS:-4000}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-3}
      CB_OPEN_DURATION_MS: ${CB_OPEN_DURATION_MS:-10000}
      MAX_INFLIGHT_REQUESTS: ${AGGREGATOR_MAX_INFLIGHT_REQUESTS:-100}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DATABASE_URL: postgres://${CANONICAL_DB_USER:-aggregator}:${CANONICAL_DB_PASSWORD}@canonical-store:5432/${CANONICAL_DB_NAME:-canonical_store}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-hazard.events}
      BMKG_BASE_URL: http://bmkg-mock:8081
      BMKG_API_KEY: ${BMKG_API_KEY}
      PVMBG_BASE_URL: http://pvmbg-mock:8082
      PVMBG_OAUTH_CLIENT_ID: ${PVMBG_OAUTH_CLIENT_ID}
      PVMBG_OAUTH_CLIENT_SECRET: ${PVMBG_OAUTH_CLIENT_SECRET}
      PVMBG_ONE_TIME_CODE: ${PVMBG_ONE_TIME_CODE}
      PVMBG_TOKEN_VOLUME_PATH: /var/lib/aggregator/pvmbg-token.json
    volumes:
      - aggregator_token_data:/var/lib/aggregator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/auth-service
    networks:
      - default
      - userdb-net
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      <<: *tracing
      GRPC_PORT: 9092
      HEALTH_PORT: 8092
      USER_DB_URL: postgres://${USER_DB_USER:-auth}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME:-user_db}?sslmode=disable
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      SECRET_SALT: ${SECRET_SALT}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-60}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  client-facing-api:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/client-facing-api
    depends_on:
      aggregator:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${CLIENT_FACING_API_PORT:-8080}:8080"
    environment:
      <<: *tracing
      PORT: 8080
      AGGREGATOR_GRPC_ADDR: aggregator:9091
      AUTH_SERVICE_GRPC_ADDR: auth-service:9092
      DASHBOARD_UPDATER_URL: http://dashboard-updater:8093
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      MAX_INFLIGHT_REQUESTS: ${CLIENT_FACING_API_MAX_INFLIGHT_REQUESTS:-100}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      AUTH_RATE_LIMIT_RPS: ${AUTH_RATE_LIMIT_RPS:-10}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-1000}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  web-frontend:
    restart: unless-stopped
    build:
      context: ./services/web-frontend
      args:
        CLIENT_FACING_API_BASE_URL: ${CLIENT_FACING_API_BASE_URL:-/api}
        FRONTEND_POLL_INTERVAL_MS: ${FRONTEND_POLL_INTERVAL_MS:-5000}
    depends_on:
      client-facing-api:
        condition: service_healthy
    ports:
      - "${WEB_FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard-updater:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/dashboard-updater
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *tracing
      HEALTH_PORT: 8093
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-hazard.events}
      QUEUE_NAME: dashboard-updater

  notifier:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/notifier
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *tracing
      HEALTH_PORT: 8094
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-hazard.events}
      QUEUE_NAME: notifier
      DEDUP_STORE_PATH: /var/lib/notifier/dedup.log
    volumes:
      - notifier_dedup_data:/var/lib/notifier

  audit-logger:
    restart: unless-stopped
    mem_limit: 256m
    build: ./services/audit-logger
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *tracing
      HEALTH_PORT: 8095
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-hazard.events}
      QUEUE_NAME: audit-logger
      DEDUP_STORE_PATH: /var/lib/audit-logger/dedup.log
    volumes:
      - audit_logger_dedup_data:/var/lib/audit-logger

# Storage is owned by one service each (doc/TRD_M1.md 0, 5, 6). The two database
# networks are internal and have exactly one client, so no other container can
# reach a database. Services without a networks key stay on the default network.
networks:
  default:
  canonical-net:
    internal: true
  userdb-net:
    internal: true

configs:
  jaeger_config:
    content: |
      service:
        extensions: [jaeger_storage, jaeger_query]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter, spanmetrics]
          metrics/spanmetrics:
            receivers: [spanmetrics]
            exporters: [prometheus]
        telemetry:
          logs:
            level: INFO
      extensions:
        jaeger_query:
          storage:
            traces: memory_store
            metrics: prometheus_store
          ui:
            config_file: /etc/jaeger/jaeger-ui.json
        jaeger_storage:
          backends:
            memory_store:
              memory:
                max_traces: 100000
          metric_backends:
            prometheus_store:
              prometheus:
                endpoint: http://prometheus:9090
                normalize_calls: true
                normalize_duration: true
      connectors:
        spanmetrics:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
      exporters:
        jaeger_storage_exporter:
          trace_storage: memory_store
        prometheus:
          endpoint: 0.0.0.0:8889
  # themes.enabled shows the dark/light toggle (off, the UI is always light); monitor turns on the Monitor tab.
  jaeger_ui_config:
    content: |
      {"themes": {"enabled": true}, "monitor": {"menuEnabled": true}}
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: aggregated-trace-metrics
          static_configs:
            - targets: ['jaeger:8889']

volumes:
  canonical_store_data:
  user_db_data:
  rabbitmq_data:
  aggregator_token_data:
  notifier_dedup_data:
  audit_logger_dedup_data:
