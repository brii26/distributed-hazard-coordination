name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          services=$(find services -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...

  lint:
    name: Lint (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: services/${{ matrix.service }}
          version: v2.13

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

  govulncheck:
    name: Vuln check (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        # Fails on any reachable vulnerability except the allowlisted IDs below.
        # (JSON mode always exits 0, so the pass/fail decision is made here.)
        # ponytail: GO-2026-6443 (grpc server panic on missing :authority/Host,
        # auth-service) is allowlisted because the fix is not in a released grpc
        # yet (>= 1.85.0). Bump grpc in go.mod and delete the allowlist entry then.
        run: |
          govulncheck -format json ./... > vuln.json
          test -s vuln.json
          found=$(jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' vuln.json \
            | sort -u | grep -v -x -e GO-2026-6443 || true)
          if [ -n "$found" ]; then
            echo "::error::govulncheck found reachable vulnerabilities: $found"
            govulncheck ./... || true
            exit 1
          fi
