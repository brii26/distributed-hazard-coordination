# Host ports the service-to-service suites need to look inside a pair. Only used by tests/integration/run.sh.
services:
  canonical-store:
    # Also on the default network, since its own network is internal.
    networks:
      - default
      - canonical-net
    ports:
      - "15432:5432"
  aggregator:
    ports:
      - "19091:9091"
