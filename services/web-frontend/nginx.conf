server {
    listen 80;
    root /usr/share/nginx/html;

    # API under /api on the page's own origin, so cookies need no CORS. The prefix is stripped.
    location /api/ {
        proxy_pass http://client-facing-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # No favicon shipped, so answer 204 instead of the app's HTML.
    location = /favicon.ico {
        return 204;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App routes are not files, fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
