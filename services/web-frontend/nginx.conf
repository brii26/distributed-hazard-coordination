server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Same origin as the page, so the HttpOnly cookies reach the API with no CORS.
    location ~ ^/(auth/|accounts$|hazards$) {
        proxy_pass http://client-facing-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }
}
