server {
    listen 80;
    root /usr/share/nginx/html;

    # The API lives under /api on the page's own origin, so the HttpOnly cookies
    # reach it with no CORS. The prefix is stripped before it is forwarded.
    location /api/ {
        proxy_pass http://client-facing-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # No favicon is shipped; say so instead of answering with the app's HTML.
    location = /favicon.ico {
        return 204;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /login, /register, /hazards and /accounts are routes of the app, not files.
    location / {
        try_files $uri /index.html;
    }
}
