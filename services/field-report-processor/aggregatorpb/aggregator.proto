// Internal-only gRPC read API of the Aggregator (doc/TRD_M1.md section 3.4).
// The Client-Facing API will keep its own copy of this file (each Docker build
// context stays self-contained), so keep the two in sync.
//
// Identity/role and the correlation ID travel as gRPC metadata (x-client-role,
// x-correlation-id), never as message fields.
//
// Regenerate (from services/aggregator):
//   protoc --proto_path=aggregatorpb \
//     --go_out=aggregatorpb --go_opt=paths=source_relative \
//     --go-grpc_out=aggregatorpb --go-grpc_opt=paths=source_relative aggregatorpb/aggregator.proto
// Needs protoc, protoc-gen-go and protoc-gen-go-grpc, e.g.
//   nix shell nixpkgs#protobuf nixpkgs#protoc-gen-go nixpkgs#protoc-gen-go-grpc
syntax = "proto3";

package aggregator.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brii26/distributed-hazard-coordination/services/aggregator/aggregatorpb";

service Aggregator {
  // OK with meta.stale_since set for stale data, UNAVAILABLE when the source is
  // down and nothing is stored, RESOURCE_EXHAUSTED past MAX_INFLIGHT_REQUESTS.
  rpc GetHazards(GetHazardsRequest) returns (GetHazardsResponse);
  // Cross-shard list of all hazard types, ordered by ingested_at then hazard_id,
  // newest first. Always OK; a shard with no reachable copy sets partial.
  rpc ListHazards(ListHazardsRequest) returns (ListHazardsResponse);
  // One hazard by id: primary copy, then the replica. NOT_FOUND when neither has
  // it, UNAVAILABLE when no copy could be reached.
  rpc GetHazard(GetHazardRequest) returns (GetHazardResponse);
  rpc GetHealth(google.protobuf.Empty) returns (HealthStatus);
  // Saves one field report once. result is STORED, DUPLICATE or PARKED; all three mean
  // the report is durable and the queue message can be acked. UNAVAILABLE when no copy
  // could commit. A non-empty park_reason makes the server park the body as is.
  rpc SaveFieldReport(SaveFieldReportRequest) returns (SaveFieldReportResponse);
}

message SaveFieldReportRequest {
  string message_id = 1; // AMQP MessageId, must equal report_id in the body
  bytes body = 2;        // the raw queue body
  string park_reason = 3;
}

message SaveFieldReportResponse {
  string result = 1; // STORED | DUPLICATE | PARKED
}

message GetHazardsRequest {
  string hazard_type = 1; // SEISMIC | VOLCANIC
  // Paging, newest first. limit 0 means the server default; it is capped server-side.
  int32 limit = 2;
  int32 offset = 3;
  string severity = 4; // optional exact filter: NORMAL | WASPADA | SIAGA | AWAS
  string query = 5;    // optional, matched against area_name (case-insensitive substring)
}

message GetHazardsResponse {
  repeated HazardEvent data = 1;
  ResponseMeta meta = 2;
  bool has_more = 3; // another page follows this one
}

message ListHazardsRequest {
  int32 limit = 1;   // 0 means the default (50), capped at 200
  string cursor = 2; // opaque, from the previous page's next_cursor; empty for the first page
}

message ListHazardsResponse {
  repeated HazardEvent data = 1;
  string next_cursor = 2; // empty on the last page
  bool has_more = 3;
  bool partial = 4;                      // some records may be missing
  repeated string unavailable_units = 5; // units with no reachable copy, e.g. "shard-3"
}

message GetHazardRequest {
  string hazard_id = 1;
}

message GetHazardResponse {
  HazardEvent event = 1;
  repeated string placement = 2; // "unit@node" per copy, primary first
}

// HazardEvent is the canonical record (TRD 3.2). Fields a source may not give are
// optional, so "missing" (null) stays distinct from an empty or zero value.
message HazardEvent {
  string hazard_id = 1;
  string source = 2;
  string source_ref_id = 3;
  string hazard_type = 4;
  optional string severity = 5;
  optional string area_name = 6;
  optional double latitude = 7;
  optional double longitude = 8;
  google.protobuf.Timestamp occurred_at = 9;
  google.protobuf.Timestamp ingested_at = 10;
  google.protobuf.Struct attributes = 11;
}

// ResponseMeta is the state of the source behind the requested hazard type.
message ResponseMeta {
  string source = 1;
  string source_status = 2; // UP | DEGRADED | DOWN
  google.protobuf.Timestamp last_success_at = 3; // unset until the first good poll
  google.protobuf.Timestamp stale_since = 4;     // unset while the source is UP
}

message HealthStatus {
  string status = 1; // ok | degraded | down
  repeated ResponseMeta sources = 2;
  bool database_connected = 3;
  bool rabbitmq_connected = 4;
}
