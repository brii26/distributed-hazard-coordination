apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: rabbitmq
spec:
  selector:
    role: broker
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: rabbitmq
spec:
  replicas: 1
  serviceName: rabbitmq
  selector:
    matchLabels:
      role: broker
  template:
    metadata:
      labels:
        role: broker
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          command: ["/bin/sh", "/etc/rabbitmq/render-definitions.sh"]
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json.tpl
              subPath: definitions.json.tpl
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/render-definitions.sh
              subPath: render-definitions.sh
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/conf.d/20-definitions.conf
              subPath: rabbitmq.conf
              readOnly: true
      volumes:
        - name: definitions
          configMap:
            name: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
