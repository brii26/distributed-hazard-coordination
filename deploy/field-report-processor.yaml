apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: field-report-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: field-report-processor
  template:
    metadata:
      labels:
        role: consumer
        app: field-report-processor
    spec:
      containers:
        - name: field-report-processor
          image: field-report-processor
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bnpb-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            - name: AGGREGATOR_ADDR
              value: dns:///aggregator-grpc:9091
            - name: HEALTH_PORT
              value: "8096"
          ports:
            - name: health
              containerPort: 8096
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
