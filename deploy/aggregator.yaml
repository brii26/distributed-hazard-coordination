apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: aggregator
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    role: aggregator
  ports:
    - name: health
      port: 8091
      targetPort: health
---
# Headless: DNS returns one A record per ready pod, the Client-Facing API balances over them (dns:///aggregator-grpc:9091).
apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: aggregator-grpc
spec:
  clusterIP: None
  selector:
    role: aggregator
  ports:
    - name: grpc
      port: 9091
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: aggregator
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      role: aggregator
  template:
    metadata:
      labels:
        role: aggregator
    spec:
      terminationGracePeriodSeconds: 45
      # Soft rule: pods spread over the nodes, but still schedule on a single node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              role: aggregator
      initContainers:
        - name: wait-for-store
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h store -p 5432 && pg_isready -h coordination-db -p 5432; do sleep 2; done"]
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: aggregator
          image: aggregator
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bnpb-config
          env:
            - name: STORE_USER
              valueFrom:
                secretKeyRef:
                  name: store-credentials
                  key: user
            - name: STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-credentials
                  key: password
            - name: STORE_DB
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: CANONICAL_DB_NAME
            - name: DATABASE_URL
              value: postgres://$(STORE_USER):$(STORE_PASSWORD)@store:5432/$(STORE_DB)?sslmode=disable
            - name: COORDINATION_DATABASE_URL
              value: postgres://$(STORE_USER):$(STORE_PASSWORD)@coordination-db:5432/coordination?sslmode=disable
            - name: STORE_SERVICE
              value: store
            - name: STORE_DSN_TEMPLATE
              value: postgres://$(STORE_USER):$(STORE_PASSWORD)@%s:5432/$(STORE_DB)?sslmode=disable
            - name: GRPC_PORT
              value: "9091"
            - name: HEALTH_PORT
              value: "8091"
            - name: MAX_INFLIGHT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: AGGREGATOR_MAX_INFLIGHT_REQUESTS
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            - name: BMKG_BASE_URL
              value: http://bmkg-mock:8081
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bmkg-credentials
                  key: api_key
            - name: PANTAI_BASE_URL
              value: http://sensor-pantai:8080
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-token
                  key: token
            - name: AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audit-token
                  key: token
            - name: PVMBG_BASE_URL
              value: http://pvmbg-mock:8082
            - name: PVMBG_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pvmbg-credentials
                  key: client_id
            - name: PVMBG_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvmbg-credentials
                  key: client_secret
            - name: PVMBG_ONE_TIME_CODE
              valueFrom:
                secretKeyRef:
                  name: pvmbg-credentials
                  key: one_time_code
            - name: PVMBG_TOKEN_VOLUME_PATH
              value: /var/lib/aggregator/pvmbg-token.json
          ports:
            - name: grpc
              containerPort: 9091
            - name: health
              containerPort: 8091
          # /health is 503 only when the store ping fails, so the pod leaves the Service endpoints.
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Does not touch the store: a store outage must not restart the pods.
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: token
              mountPath: /var/lib/aggregator
      volumes:
        - name: token
          emptyDir: {}
