# Ingress policies on the storage pods only. No egress rules, so DNS and kubelet probes (exec probes) are untouched.
# user-db and coordination-db also have role=store, so the store policy excludes both apps and later shard pods stay covered.
# The node CIDR rule lets the hostNetwork Tester Agent (and node-originated traffic) reach the stores; adjust it if the nodes use another range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: store-from-aggregator
spec:
  podSelector:
    matchLabels:
      role: store
    matchExpressions:
      - {key: app, operator: NotIn, values: [user-db, coordination-db]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
        - ipBlock:
            cidr: 10.77.0.0/24
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: user-db-from-auth
spec:
  podSelector:
    matchLabels:
      app: user-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - ipBlock:
            cidr: 10.77.0.0/24
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: coordination-db-from-aggregator
spec:
  podSelector:
    matchLabels:
      app: coordination-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
        - ipBlock:
            cidr: 10.77.0.0/24
      ports:
        - protocol: TCP
          port: 5432
---
# The gRPC API (:9091) serves raw failed-message payloads to the Operator route, so only its two callers may reach it: the
# Client-Facing API (AGGREGATOR_GRPC_ADDR) and the field-report-processor (SaveFieldReport, PR #390). The HTTP port (:8091: /health, /metrics, /internal/audit/*) stays open
# to every pod in the namespace as before (Prometheus, auditors, probes); the audit routes have their own token.
# The Tester Agent, the load scripts and the other services never call :9091 (they use port-forward to :8091).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: aggregator-grpc-from-callers
spec:
  podSelector:
    matchLabels:
      role: aggregator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client-facing-api
        # PR #390 (#306): calls SaveFieldReport on :9091; no pod matches until that Deployment exists.
        - podSelector:
            matchLabels:
              app: field-report-processor
      ports:
        - protocol: TCP
          port: 9091
    - ports:
        - protocol: TCP
          port: 8091
