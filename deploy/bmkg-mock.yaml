apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: bmkg-mock
spec:
  type: ClusterIP
  selector:
    app: bmkg-mock
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: bmkg-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bmkg-mock
  template:
    metadata:
      labels:
        role: mock
        app: bmkg-mock
    spec:
      containers:
        - name: bmkg-mock
          image: bmkg-mock
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bmkg-credentials
                  key: api_key
            - name: SEED_COUNT
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: BMKG_SEED_COUNT
            - name: EVENT_INTERVAL_S
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: BMKG_EVENT_INTERVAL_S
            - name: BMKG_DELAY_MIN_MS
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: BMKG_DELAY_MIN_MS
            - name: BMKG_DELAY_MAX_MS
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: BMKG_DELAY_MAX_MS
            - name: TRACING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: TRACING_ENABLED
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
