apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: situation-summarizer
spec:
  type: ClusterIP
  selector:
    app: situation-summarizer
  ports:
    - name: http
      port: 8097
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: situation-summarizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: situation-summarizer
  template:
    metadata:
      labels:
        role: consumer
        app: situation-summarizer
    spec:
      containers:
        - name: situation-summarizer
          image: situation-summarizer
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bnpb-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
            - name: QUEUE_NAME
              value: situation-summarizer
            - name: HEALTH_PORT
              value: "8097"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: api_key
                  optional: true
          ports:
            - name: http
              containerPort: 8097
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
